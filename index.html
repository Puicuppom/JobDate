      <span>เสร็จ 1</span>
      <span>วัน 2</span>
      <span>เสร็จ 2</span>
      <span></span>
    </div>
    <section id="jobs" aria-live="polite"></section>
    <div id="empty" class="empty">ยังไม่มีรายการ กด “เพิ่มรายการ” เพื่อเริ่มต้น</div>
    <p class="note">คำนวณตามวันปฏิทิน รวมวันเสาร์–อาทิตย์<br>ข้อมูลจะถูกบันทึกไว้เฉพาะในอุปกรณ์นี้</p>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <template id="jobTemplate">
    <article class="job">
      <div class="fields">
        <div class="done-wrap"><input class="done-check" type="checkbox" aria-label="ทำงานนี้เสร็จแล้ว" title="ทำแล้ว"></div>
        <div class="field"><span class="field-name">วันเริ่ม</span><div class="input-row start-row"><input class="start-display" type="text" readonly placeholder="วว/ดด/ปป"><span class="start-calendar">▾</span><input class="start" type="date" aria-label="เลือกวันเริ่ม"></div></div>
        <div class="field"><span class="field-name">จำนวนวัน 1</span><div class="input-row"><input class="days-1" type="number" inputmode="numeric" min="1" step="1" placeholder="0"></div></div>
        <div class="field"><span class="field-name">เสร็จ 1</span><div class="input-row"><input class="finish-1" type="text" readonly placeholder="รอข้อมูล"></div></div>
        <div class="field"><span class="field-name">จำนวนวัน 2</span><div class="input-row"><input class="days-2" type="number" inputmode="numeric" min="1" step="1" placeholder="0"></div></div>
        <div class="field"><span class="field-name">เสร็จ 2</span><div class="input-row"><input class="finish-2" type="text" readonly placeholder="รอข้อมูล"></div></div>
        
        <button class="remove row-remove" type="button" aria-label="ลบรายการ" title="ลบรายการ">×</button>
      </div>
    </article>
  </template>
  <script>
    const jobsEl=document.querySelector('#jobs'),tpl=document.querySelector('#jobTemplate'),toast=document.querySelector('#toast'),countStart=document.querySelector('#countStart'),allDays1=document.querySelector('#allDays1'),allDays2=document.querySelector('#allDays2');
    const pad=n=>String(n).padStart(2,'0');
    const dateText=value=>{if(!value)return '';const [y,m,d]=value.split('-').map(Number);return `${pad(d)}/${pad(m)}/${y}`};
    const shortDateText=value=>{if(!value)return '';const [y,m,d]=value.split('-').map(Number);return `${pad(d)}/${pad(m)}/${String(y).slice(-2)}`};
    const finishDate=(start,days)=>{if(!start||!days||days<1)return '';const [y,m,d]=start.split('-').map(Number),dt=new Date(y,m-1,d);dt.setDate(dt.getDate()+Number(days)-(countStart.checked?1:0));return `${pad(dt.getDate())}/${pad(dt.getMonth()+1)}/${dt.getFullYear()}`};
    let toastTimer=null;function flash(msg){clearTimeout(toastTimer);toast.classList.remove('show');toast.textContent=msg;requestAnimationFrame(()=>{toast.classList.add('show');toastTimer=setTimeout(()=>toast.classList.remove('show'),1200)})}
    function data(){return [...document.querySelectorAll('.job')].map(el=>({start:el.querySelector('.start').value,days1:el.querySelector('.days-1').value,days2:el.querySelector('.days-2').value,done:el.querySelector('.done-check').checked}))}
    function save(){localStorage.setItem('job-planner-v1',JSON.stringify({countStart:countStart.checked,allDays1:allDays1.value,allDays2:allDays2.value,jobs:data()}))}
    function recalc(el){
      const start=el.querySelector('.start').value,days1=Number(el.querySelector('.days-1').value),days2=Number(el.querySelector('.days-2').value);
      el.querySelector('.start-display').value=shortDateText(start);
      el.querySelector('.finish-1').value=finishDate(start,days1);
      el.querySelector('.finish-2').value=start&&days1>0&&days2>0?finishDate(start,days1+days2):'';
    }
    function renumber(){document.querySelector('#empty').classList.toggle('show',!jobsEl.children.length)}
    function addJob(values={}){const el=tpl.content.firstElementChild.cloneNode(true);el.querySelector('.start').value=values.start||'';el.querySelector('.days-1').value=values.days1||values.days||'';el.querySelector('.days-2').value=values.days2||'';el.querySelector('.done-check').checked=values.done===true;el.classList.toggle('is-done',values.done===true);
      el.addEventListener('input',()=>{recalc(el);save()});
      const startInput=el.querySelector('.start');
      el.querySelector('.start-row').addEventListener('click',e=>{
        e.preventDefault();
        try{if(typeof startInput.showPicker==='function')startInput.showPicker();else startInput.focus()}catch{startInput.focus()}
      });
      el.querySelector('.done-check').addEventListener('change',e=>{el.classList.toggle('is-done',e.target.checked);save()});
      const removeBtn=el.querySelector('.remove'); if(removeBtn) removeBtn.onclick=()=>{el.remove();renumber();save()};
      jobsEl.append(el);recalc(el);renumber();save();return el}
    document.querySelector('#addJob').onclick=()=>{const el=addJob();el.querySelector('.start').focus()};
    document.querySelector('#applyAllDays').onclick=()=>{
      const v1=Number(allDays1.value),v2=Number(allDays2.value);
      if(!Number.isInteger(v1)||v1<1||!Number.isInteger(v2)||v2<1)return flash('กรุณาใส่จำนวนวันทั้ง 2 ช่วง');
      document.querySelectorAll('.job').forEach(el=>{el.querySelector('.days-1').value=v1;el.querySelector('.days-2').value=v2;recalc(el)});
      save();flash(`ตั้งช่วง 1 = ${v1} วัน และช่วง 2 = ${v2} วันแล้ว`);
    };
    [allDays1,allDays2].forEach(input=>{input.addEventListener('keydown',e=>{if(e.key==='Enter')document.querySelector('#applyAllDays').click()});input.addEventListener('input',save)});
    document.querySelector('#clearAll').onclick=()=>{if(!confirm('ล้างข้อมูลทั้งหมดใช่ไหม?'))return;localStorage.removeItem('job-planner-v1');jobsEl.replaceChildren();allDays1.value='';allDays2.value='';countStart.checked=true;addJob({start:new Date().toLocaleDateString('en-CA')});flash('ล้างข้อมูลแล้ว')};
    countStart.onchange=()=>{document.querySelectorAll('.job').forEach(recalc);save()};
    try{const old=JSON.parse(localStorage.getItem('job-planner-v1'));if(old){countStart.checked=old.countStart!==false;allDays1.value=old.allDays1||old.allDays||'';allDays2.value=old.allDays2||'';(old.jobs||[]).forEach(addJob)}}catch{}
    if(!jobsEl.children.length)addJob({start:new Date().toLocaleDateString('en-CA')});
    if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  </script>
</body>
</html>
